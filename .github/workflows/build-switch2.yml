name: build-switch2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-nx-switch2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  switch2:
    name: Nintendo Switch 2 (.nro)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      OUNCE_DEVKIT_COMMIT: 0f38ba80d7ee768c5749278f127749d14ece2036
      OUNCE_DEVKIT_VERSION: '20261115'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git safe directory & build tools
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils git cmake python3

      - name: Prepare pinned Switch 2 SDK (ounce-devkit)
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/ounce-devkit"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/ouncebrew/ounce-devkit.git "$OUNCE_DEVKIT_COMMIT"
          git -C "$sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$sdk" rev-parse HEAD)" = "$OUNCE_DEVKIT_COMMIT"
          bash "$sdk/install.sh" "$OUNCE_DEVKIT_VERSION"
          test -f "$DEVKITPRO/libounce/switch2_rules"
          test -f "$DEVKITPRO/portlibs/switch2/lib/libEGL.a"
          test -f "$DEVKITPRO/portlibs/switch/lib/libSDL2.a"
          test -f "$DEVKITPRO/portlibs/switch/lib/libcurl.a"
          cat "$DEVKITPRO/ounce-devkit-version.txt"

      - name: Run package verifier unit tests
        run: python3 -m unittest tests/test_switch2_package.py -v

      - name: Build WebRTC deps for Switch 2 (libpeer/srtp/usrsctp/mbedtls)
        run: bash deps/build-switch2.sh --in-place

      - name: Build green-nx-switch2.nro
        run: |
          set -eo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          if ! make -f Makefile.switch2 -j"$(nproc)" 2>&1 | tee switch2-build.log; then
            {
              echo "### Switch 2 build failed (tail)"
              echo '```'
              tail -n 60 switch2-build.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify Switch 2 NRO & link map
        run: |
          set -euo pipefail
          python3 tools/verify_switch2_package.py green-nx-switch2.nro \
            --link-map build-switch2/green-nx-switch2.map
          sha256sum green-nx-switch2.nro > green-nx-switch2.nro.sha256
          ls -lh green-nx-switch2.nro green-nx-switch2.nro.sha256
          cat green-nx-switch2.nro.sha256

      - name: Upload Switch 2 NRO
        uses: actions/upload-artifact@v4
        with:
          name: green-nx-switch2-nro
          if-no-files-found: error
          path: |
            green-nx-switch2.nro
            green-nx-switch2.nro.sha256

      - name: Upload Switch 2 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-nx-switch2-logs
          if-no-files-found: ignore
          path: |
            switch2-build.log
            build-switch2/green-nx-switch2.map
